<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2035" />
      <stop offset="60%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#070914" />
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#avatarBg)" />
  <rect x="8" y="8" width="384" height="384" rx="36" stroke="url(#neonBorder)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Ambient background rings -->
  <circle cx="200" cy="180" r="110" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3" />
  <circle cx="200" cy="180" r="135" stroke="#22D3EE" stroke-width="1" stroke-dasharray="10 10" stroke-opacity="0.2" />

  <!-- Stylized avatar silhouette / developer emblem -->
  <circle cx="200" cy="155" r="48" fill="#13192B" stroke="url(#neonBorder)" stroke-width="2.5" filter="url(#softGlow)" />
  <path d="M125 295C125 240 160 220 200 220C240 220 275 240 275 295" stroke="url(#neonBorder)" stroke-width="2.5" stroke-linecap="round" fill="#13192B" filter="url(#softGlow)" />
  
  <!-- Subtle code brackets overlay -->
  <path d="M175 145L160 155L175 165" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M225 145L240 155L225 165" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M206 142L194 168" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />

  <!-- Badge at bottom -->
  <rect x="130" y="325" width="140" height="32" rx="16" fill="#101426" stroke="url(#neonBorder)" stroke-width="1" />
  <circle cx="148" cy="341" r="4" fill="#22D3EE" />
  <text x="162" y="346" fill="#F4F5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DEVELOPER</text>
</svg>
